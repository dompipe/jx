name: JX language contracts CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium
      - name: Semantic parser breadth
        run: php -d zend.assertions=1 -d assert.exception=1 test-jx-semantic.php parse
      - name: Semantic interpreter breadth
        run: php -d zend.assertions=1 -d assert.exception=1 test-jx-semantic.php language
      - name: Semantic numeric control flow
        run: php -d zend.assertions=1 -d assert.exception=1 test-jx-semantic.php numeric
      - name: JXL basic mutation
        run: php -d zend.assertions=1 -d assert.exception=1 test-jx-semantic.php jxl-basic
      - name: JXL function call
        run: php -d zend.assertions=1 -d assert.exception=1 test-jx-semantic.php jxl-call
      - name: JXL while
        run: php -d zend.assertions=1 -d assert.exception=1 test-jx-semantic.php jxl-while
      - name: JXL continue
        run: php -d zend.assertions=1 -d assert.exception=1 test-jx-semantic.php jxl-continue
      - name: JXL break
        run: php -d zend.assertions=1 -d assert.exception=1 test-jx-semantic.php jxl-break
      - name: JXL do-while
        run: php -d zend.assertions=1 -d assert.exception=1 test-jx-semantic.php jxl-do
      - name: JXL repeat
        run: php -d zend.assertions=1 -d assert.exception=1 test-jx-semantic.php jxl-repeat
      - name: JXL combined numeric parity
        run: php -d zend.assertions=1 -d assert.exception=1 test-jx-semantic.php jxl
      - name: JXL attachment byte law
        run: php -d zend.assertions=1 -d assert.exception=1 test-jx-semantic.php attachment
      - name: Prepared type metadata and source map
        run: php -d zend.assertions=1 -d assert.exception=1 test-jx-prepared-metadata.php
      - name: Deterministic JXL Book and embedded metadata
        run: php -d zend.assertions=1 -d assert.exception=1 test-jx-jxl-book64.php
      - name: Book Ed25519 trust and capabilities
        run: php -d zend.assertions=1 -d assert.exception=1 test-jx-book-trust.php
      - name: RefSign and Bag write transaction
        run: php -d zend.assertions=1 -d assert.exception=1 test-jx-bag-transaction.php
      - name: Foreground-first fair service turn
        run: php -d zend.assertions=1 -d assert.exception=1 test-jx-service-turn.php
      - name: Transactional Book generation and rollback
        run: php -d zend.assertions=1 -d assert.exception=1 test-jx-book-generation.php
      - name: jx.exe semantic JXL and 64B paths
        run: php -d zend.assertions=1 -d assert.exception=1 test-jx-cli-semantic.php
