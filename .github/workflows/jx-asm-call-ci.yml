name: JX ASM call CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  asm-call:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release v4 one-byte hot calls
        run: >-
          cc -O2 -std=c11 -Wall -Wextra -Werror -Ihost/common
          -o /tmp/jx-asm-call
          tests/jx-asm-call.c
          host/common/jx-asm-call.c
          && /tmp/jx-asm-call
      - name: Verify profiled automatic hot promotion
        run: >-
          cc -O2 -std=c11 -Wall -Wextra -Werror -DJX_ASM_CALL_PROFILE=1 -Ihost/common
          -o /tmp/jx-asm-profile
          tests/jx-asm-profile.c
          host/common/jx-asm-profile.c
          host/common/jx-asm-call.c
          && /tmp/jx-asm-profile
