name: JX compiler CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  full-runnable-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none
      - name: Full active-tree runnable gate
        run: php -d zend.assertions=1 -d assert.exception=1 test-all.php
      - name: Shared hot-register ABI
        run: php test-hot-register.php
      - name: Shared hot-event ABI
        run: php test-hot-event.php
      - name: API hot-dispatch ABI
        run: php test-api-dispatch.php
      - name: Shared hot-shadow ABI
        run: php test-hot-shadow.php
      - name: Deterministic native 64B Book package
        run: php test-native-book64.php
      - name: Native loader recognizes renamed 64B Book
        run: |
          php tests/make-jx64-fixture.php /tmp/compiled-book.renamed
          cc -O2 -std=c11 -Wall -Wextra -Werror -o /tmp/jx64-probe tests/jx64-probe.c host/common/jx64-probe.c
          /tmp/jx64-probe /tmp/compiled-book.renamed

  browser-media-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Media control host smoke
        run: node tests/jx-media-host-smoke.js
      - name: Audio signal math smoke
        run: node tests/jx-audio-signal-host-smoke.js

  jx11-native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install XCB and Cairo development libraries
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libcairo2-dev pkg-config
      - name: Build jx11
        run: >-
          cc -O2 -Wall -Wextra -Werror -o /tmp/jx11
          host/linux/jx11.c
          host/linux/jx11-register.c
          host/linux/jx11-shadow.c
          host/linux/jx11-window-hot.c
          host/linux/jx11-event.c
          host/linux/jx11-ewmh.c
          host/linux/jx11-workspace.c
          host/linux/jx11-live-patch.c
          host/common/jx-live-patch.c
          $(pkg-config --cflags --libs xcb cairo-xcb)
      - name: Verify native generic hot-event ABI
        run: cc -O2 -std=c11 -Wall -Wextra -Werror -o /tmp/jx-hot-event-abi tests/jx-hot-event-abi.c && /tmp/jx-hot-event-abi
      - name: Verify native API dispatch ABI
        run: cc -O2 -std=c11 -Wall -Wextra -Werror -Ihost/common -o /tmp/jx-api-dispatch-abi tests/jx-api-dispatch-abi.c && /tmp/jx-api-dispatch-abi
      - name: Verify secure live-patch validation
        run: cc -O2 -std=c11 -Wall -Wextra -Werror -o /tmp/jx-live-patch tests/jx-live-patch.c host/common/jx-live-patch.c && /tmp/jx-live-patch
      - name: Verify narrow SSH patch protocol
        run: cc -O2 -std=c11 -Wall -Wextra -Werror -o /tmp/jx-patch-ssh tests/jx-patch-ssh.c host/common/jx-patch-ssh.c && /tmp/jx-patch-ssh
      - name: Verify JX11 safe-point patch generations
        run: cc -O2 -std=c11 -Wall -Wextra -Werror -o /tmp/jx11-live-patch tests/jx11-live-patch.c host/linux/jx11-live-patch.c host/common/jx-live-patch.c && /tmp/jx11-live-patch
      - name: Verify native register ABI
        run: cc -O2 -Wall -Wextra -Werror -o /tmp/jx11-register-abi tests/jx11-register-abi.c host/linux/jx11-register.c && /tmp/jx11-register-abi
      - name: Verify native shadow ABI
        run: cc -O2 -Wall -Wextra -Werror -o /tmp/jx11-shadow-abi tests/jx11-shadow-abi.c host/linux/jx11-shadow.c host/linux/jx11-window-hot.c && /tmp/jx11-shadow-abi
      - name: Verify native event sender
        run: cc -O2 -std=c11 -Wall -Wextra -Werror -o /tmp/jx11-event-sender tests/jx11-event-sender.c host/linux/jx11-event.c && /tmp/jx11-event-sender
      - name: Verify EWMH client bookkeeping
        run: cc -O2 -std=c11 -Wall -Wextra -Werror -o /tmp/jx11-ewmh-clients tests/jx11-ewmh-clients.c host/linux/jx11-ewmh.c -lxcb && /tmp/jx11-ewmh-clients
      - name: Verify workspace visibility semantics
        run: cc -O2 -std=c11 -Wall -Wextra -Werror -o /tmp/jx11-workspace tests/jx11-workspace.c host/linux/jx11-workspace.c && /tmp/jx11-workspace
      - name: Verify jx11 CLI
        run: /tmp/jx11 --help

  linux-native-store:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none
      - name: Compile canonical JX Store to Linux ELF
        run: |
          php examples/store/build-store.php
          cc -O2 -Ihost/common -o examples/store/build/jx-store examples/store/build/store.c examples/store/build/store-linux.s host/common/jx64-probe.c
      - name: Verify Linux native pages
        run: |
          test "$(examples/store/build/jx-store books/home)" = "books/home=96"
          test "$(examples/store/build/jx-store turtles/habitats)" = "turtles/habitats=387"
      - name: Package and rename Linux 64B Book
        run: |
          php examples/store/package-native.php linux-elf examples/store/build/jx-store examples/store/build/jx-store.64B
          cp examples/store/build/jx-store.64B examples/store/build/store.payload
          examples/store/build/jx-store --probe examples/store/build/store.payload

  windows-native-store:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none
      - name: Build shared JX store sources
        run: php examples/store/build-store.php
      - name: Build native Windows PE executable
        shell: pwsh
        run: |
          clang -O2 -Ihost/common -o examples/store/build/jx-store.exe examples/store/build/store.c examples/store/build/store-windows.s host/common/jx64-probe.c
          $cases = @{
            'books/home' = '96'
            'books/catalog' = '60'
            'books/specials' = '84'
            'turtles/home' = '16'
            'turtles/habitats' = '387'
            'turtles/care' = '113'
          }
          foreach ($page in $cases.Keys) {
            $actual = (& examples/store/build/jx-store.exe $page).Trim()
            $expected = "$page=$($cases[$page])"
            if ($actual -ne $expected) { throw "Windows JX page mismatch: $actual != $expected" }
          }
      - name: Package and rename Windows 64B Book
        shell: pwsh
        run: |
          php examples/store/package-native.php windows-pe examples/store/build/jx-store.exe examples/store/build/jx-store.64B
          Copy-Item examples/store/build/jx-store.64B examples/store/build/store.payload
          $probe = (& examples/store/build/jx-store.exe --probe examples/store/build/store.payload).Trim()
          if ($probe -notmatch '^JX64/1\.0 sections=4$') { throw "Windows native JX64 probe failed: $probe" }
