name: JX compiler CI

on:
  push:
    branches: [bag-backed-containers]
  pull_request:
    branches: [main]

jobs:
  php-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Lint compiler files
        run: |
          php -l pasm-bytecode.php
          php -l pasm-loop-space.php
          php -l pasm-lang-compiler-loop.php
          php -l pasm-loop-fuser.php
          php -l pasm-iterator-abi.php
          php -l pasm-register-command.php
          php -l pasm-register-fast-vm.php
          php -l pasm-lang.php
          php -l jx-alias.php
          php -l pasm-bag-hotops.php
          php -l jx-bag-containers.php
          php -l benchmark-loop-active.php
          php -l benchmark-loop-legacy.php
          php -l benchmark-register-command.php
      - name: Active packed PASM bytecode
        run: php test-pasm-packed-active.php
      - name: Loop-space model
        run: php test-pasm-loop-space.php
      - name: Compiled loop emission
        run: php test-pasm-loop-compiler.php
      - name: Compact foreach iterator ABI
        run: php test-pasm-iterator-abi.php
      - name: Ordered register command ABI
        run: php test-pasm-register-command.php
      - name: Alias registry
        run: php test-jx-alias.php
      - name: JX language aliases
        run: php test-jx-lang-alias.php
      - name: Bag hot operations
        run: php test-pasm-bag-hotops.php
      - name: Bag-backed containers
        run: php test-jx-bag-containers.php
      - name: Packed register command benchmark
        run: php benchmark-register-command.php 200000 9
      - name: Legacy inline loop benchmark
        run: php benchmark-loop-legacy.php 10000 9
      - name: Active fused loop benchmark
        run: php benchmark-loop-active.php 10000 9
