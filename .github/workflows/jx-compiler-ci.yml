name: JX compiler CI

on:
  push:
    branches: [bag-backed-containers]
  pull_request:
    branches: [main]

jobs:
  full-runnable-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Full active-tree runnable gate
        run: php -d zend.assertions=1 -d assert.exception=1 test-all.php
