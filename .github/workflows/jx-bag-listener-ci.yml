name: JX Bag listener CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bag-listener:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Bag listener prepare commit rollback
        run: >-
          cc -O2 -std=c11 -Wall -Wextra -Werror -Ihost/common
          -o /tmp/jx-bag-listener
          tests/jx-bag-listener.c
          host/common/jx-bag-listener.c
          host/common/jx-bag-patch.c
          && /tmp/jx-bag-listener
      - name: Verify shadow bytecode filter fallback
        run: >-
          cc -O2 -std=c11 -Wall -Wextra -Werror -Ihost/common
          -o /tmp/jx-exec-branch
          tests/jx-exec-branch.c
          host/common/jx-exec-branch.c
          host/common/jx-bag-listener.c
          host/common/jx-bag-patch.c
          && /tmp/jx-exec-branch
      - name: Verify button-triggered multipoint channel-root hot swap
        run: >-
          cc -O2 -std=c11 -Wall -Wextra -Werror -Ihost/common
          -o /tmp/jx-hot-swap
          tests/jx-hot-swap.c
          host/common/jx-hot-swap.c
          host/common/jx-channel-bus.c
          && /tmp/jx-hot-swap
      - name: Verify lower-right global power readiness control
        run: >-
          cc -O2 -std=c11 -Wall -Wextra -Werror -Ihost/common
          -o /tmp/jx-global-power
          tests/jx-global-power.c
          host/common/jx-global-power.c
          && /tmp/jx-global-power
      - name: Verify proven takeover persists replacement jx11 executable
        run: >-
          cc -O2 -std=c11 -Wall -Wextra -Werror -Ihost/common -Ihost/linux
          -o /tmp/jx11-power-tether
          tests/jx11-power-tether.c
          host/linux/jx11-power-tether.c
          host/linux/jx11-exe-tether.c
          host/common/jx-hot-swap.c
          host/common/jx-channel-bus.c
          $(pkg-config --cflags --libs openssl)
          && /tmp/jx11-power-tether
      - name: Verify Linux X11 and Win32 semantic trace comparison
        run: >-
          cc -O2 -std=c11 -Wall -Wextra -Werror -Ihost/common
          -o /tmp/jx-host-trace
          tests/jx-host-trace.c
          host/common/jx-host-trace.c
          && /tmp/jx-host-trace
      - name: Verify installer-provisioned SSH maintainer Bag plane
        run: >-
          cc -O2 -std=c11 -Wall -Wextra -Werror -Ihost/common
          -o /tmp/jx-remote-bag
          tests/jx-remote-bag.c
          host/common/jx-remote-bag.c
          host/common/jx-bag-listener.c
          host/common/jx-bag-patch.c
          && /tmp/jx-remote-bag
      - name: Verify maintainer SSH canonical wire and framing
        run: >-
          cc -O2 -std=c11 -Wall -Wextra -Werror -Ihost/common
          -o /tmp/jx-maintainer-ssh
          tests/jx-maintainer-ssh.c
          host/common/jx-maintainer-ssh.c
          host/common/jx-remote-bag-wire.c
          host/common/jx-remote-bag.c
          host/common/jx-bag-listener.c
          host/common/jx-bag-patch.c
          && /tmp/jx-maintainer-ssh
      - name: Build installer-only SSH maintainer receiver
        run: >-
          cc -O2 -std=c11 -Wall -Wextra -Werror -Ihost/common
          -o /tmp/jx-maintainer-receiver
          host/linux/jx-maintainer-receiver.c
          host/common/jx-maintainer-ssh.c
          host/common/jx-maintainer-ipc.c
          host/common/jx-remote-bag-wire.c
      - name: Verify private maintainer Bag service transaction
        run: >-
          cc -O2 -std=c11 -Wall -Wextra -Werror -Ihost/common
          -o /tmp/jx-maintainer-service
          tests/jx-maintainer-service.c
          host/common/jx-maintainer-service.c
          host/common/jx-remote-bag.c
          host/common/jx-bag-listener.c
          host/common/jx-bag-patch.c
          && /tmp/jx-maintainer-service
