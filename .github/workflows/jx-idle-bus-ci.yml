name: JX idle bus CI

on:
  push:
    paths:
      - 'host/common/jx-idle-bus.*'
      - 'host/common/jx-idle-collect.*'
      - 'host/common/jx-idle-bitmap.*'
      - 'host/linux/jx-idle-shared.*'
      - 'tests/jx-idle-bus.c'
      - 'tests/jx-idle-collect.c'
      - 'tests/jx-idle-bitmap.c'
      - 'tests/jx-idle-shared.c'
      - '.github/workflows/jx-idle-bus-ci.yml'
  workflow_dispatch:

jobs:
  idle-bus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test three-byte idle permission bus
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            tests/jx-idle-bus.c host/common/jx-idle-bus.c \
            -o /tmp/jx-idle-bus
          /tmp/jx-idle-bus
      - name: Build and test ordered atomic bitstring bus
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pthread \
            tests/jx-idle-bitmap.c host/common/jx-idle-bitmap.c \
            -o /tmp/jx-idle-bitmap
          /tmp/jx-idle-bitmap
      - name: Build and test atomic second collection bus
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pthread \
            tests/jx-idle-collect.c \
            host/common/jx-idle-collect.c host/common/jx-idle-bus.c \
            -o /tmp/jx-idle-collect
          /tmp/jx-idle-collect
      - name: Build and test shared sleeping-process wake
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            tests/jx-idle-shared.c host/linux/jx-idle-shared.c \
            -o /tmp/jx-idle-shared
          /tmp/jx-idle-shared
