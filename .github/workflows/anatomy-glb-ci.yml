name: JX Anatomy GLB CI

on:
  push:
    branches:
      - feature/anatomy-modeler
  workflow_dispatch:

jobs:
  anatomy-glb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP version
        run: php -v
      - name: Lint JX Anatomy GLB exporter
        run: |
          php -l jx/plugins/AnatomyGLB.php
          php -l examples/anatomy-export-glb.php
          php -l test-anatomy-glb.php
      - name: Lint JX anatomy browser pipeline
        run: |
          node --check host/browser/jx-anatomy-texture-skin.js
          node --check host/browser/jx-anatomy-texture-bake.js
          node --check host/browser/jx-anatomy-json-project.js
          node --check host/browser/jx-glb-store.js
          grep -q "installExportBakeBridge" host/browser/jx-anatomy-texture-bake.js
          grep -q "mirror-back" host/browser/jx-anatomy-texture-bake.js
          grep -q "jx-anatomy-texture-bake.js" host/browser/jx-anatomy-texture-skin.js
          grep -q "jx-anatomy-json-project.js" host/browser/jx-anatomy-texture-skin.js
          grep -q "Load JX anatomy JSON" host/browser/jx-anatomy-json-project.js
          grep -q "Save reloadable JX project JSON" host/browser/jx-anatomy-json-project.js
          grep -q "textureAssets" host/browser/jx-anatomy-json-project.js
          grep -q "referenceImage" host/browser/jx-anatomy-json-project.js
      - name: Run JX Anatomy GLB regression
        run: php test-anatomy-glb.php
