name: JX Win32 host CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  win32-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Win32 desktop host with applied idle bus, trace, power and live Task Manager
        shell: pwsh
        run: >-
          clang -O2 -Wall -Wextra -Werror
          -Ihost/common -Ihost/windows
          -o $env:TEMP/jx-win32-host.exe
          host/windows/jx-win32-bus-host.c
          host/windows/jx-idle-shared.c
          host/common/jx-host-trace.c
          host/common/jx-global-power.c
          host/common/jx-task-manager.c
          host/common/jx-task-control.c
          -luser32 -lgdi32 -lshell32
          -Xlinker /subsystem:windows
      - name: Build and test Win32 WaitOnAddress applied idle bus ABI
        shell: pwsh
        run: |
          clang -O2 -Wall -Wextra -Werror `
            -Ihost/common -Ihost/windows `
            -o $env:TEMP/jx-win32-idle-shared.exe `
            tests/jx-win32-idle-shared.c `
            host/windows/jx-idle-shared.c `
            host/common/jx-idle-bus.c
          & $env:TEMP/jx-win32-idle-shared.exe
      - name: Build Win32 executable tether helper
        shell: pwsh
        run: >-
          clang -O2 -Wall -Wextra -Werror
          -Ihost/windows
          -o $env:TEMP/jx-win32-tether-helper.exe
          host/windows/jx-win32-tether-helper.c
          -Xlinker /subsystem:console
      - name: Compile Win32 executable tether launcher
        shell: pwsh
        run: >-
          clang -O2 -Wall -Wextra -Werror -c
          -Ihost/windows
          host/windows/jx-win32-exe-tether.c
          -o $env:TEMP/jx-win32-exe-tether.obj
      - name: Compile Win32 proven-takeover power tether
        shell: pwsh
        run: >-
          clang -O2 -Wall -Wextra -Werror -c
          -Ihost/common -Ihost/windows
          host/windows/jx-win32-power-tether.c
          -o $env:TEMP/jx-win32-power-tether.obj
      - name: Compile shared hot-swap and channel bus for Win32
        shell: pwsh
        run: >-
          clang -O2 -Wall -Wextra -Werror -c
          -Ihost/common
          host/common/jx-hot-swap.c
          host/common/jx-channel-bus.c
