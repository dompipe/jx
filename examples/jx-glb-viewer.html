<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JX GLB Viewer</title>
<style>
html,body{height:100%;margin:0;background:#0c1118;color:#e9eff7;font:14px system-ui}*{box-sizing:border-box}#app{height:100%;display:grid;grid-template-columns:280px 1fr;grid-template-rows:48px 1fr 30px}header{grid-column:1/3;display:flex;align-items:center;gap:9px;padding:0 14px;background:#171e27;border-bottom:1px solid #2e3948}header b{font-size:16px}.pill{padding:5px 8px;border:1px solid #405168;border-radius:7px;background:#202936}aside{padding:12px;background:#151b23;border-right:1px solid #2e3948;overflow:auto}main{position:relative;min-width:0;min-height:0}#viewer{position:absolute;inset:0}#viewer canvas{display:block;width:100%;height:100%}footer{grid-column:1/3;padding:6px 12px;background:#171e27;border-top:1px solid #2e3948;color:#95a5b8;font-size:12px}h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#8fa2ba;margin:15px 0 8px}.action,select{width:100%;padding:8px;border:1px solid #39475a;border-radius:6px;background:#202936;color:#eef4fb;margin:3px 0}.action{cursor:pointer}.primary{background:#264666;border-color:#507da9}.drop{display:block;border:1px dashed #465970;border-radius:7px;padding:13px;text-align:center;color:#b7c4d4;cursor:pointer}.drop input{display:none}.box{padding:9px;border:1px solid #334154;border-radius:7px;background:#111820;color:#9faec0;font-size:12px;line-height:1.45}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.check{display:flex;align-items:center;gap:8px;margin:8px 0}.good{color:#8ad797}.warn{color:#efbd68}@media(max-width:800px){#app{grid-template-columns:1fr;grid-template-rows:auto auto minmax(420px,1fr) auto}header,footer{grid-column:1}aside{border-right:0;border-bottom:1px solid #2e3948}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}</script>
</head><body><div id="app"><header><b>JX GLB Viewer</b><span class="pill">GLB / glTF 2.0</span><span class="pill">JX Family</span><span class="pill">Mesh Inspector</span></header>
<aside><h2>Open model</h2><label class="drop">Choose .glb file<input id="file" type="file" accept=".glb,model/gltf-binary"></label><button class="action primary" id="openLast">Open last JX export</button><p class="box">You can also drag a <b>.glb</b> file anywhere onto the 3D viewport.</p>
<h2>Views</h2><div class="grid2"><button class="action" data-view="front">Front</button><button class="action" data-view="right">Side</button><button class="action" data-view="top">Top</button><button class="action" data-view="frame">Frame</button></div><label class="check"><input id="grid" type="checkbox" checked> Grid</label><label class="check"><input id="axes" type="checkbox" checked> XYZ axes</label><label class="check"><input id="wire" type="checkbox"> Wireframe</label>
<h2>Animation</h2><select id="animation"><option value="">No animation</option></select><div class="grid2"><button class="action" id="play">Play</button><button class="action" id="stop">Stop</button></div>
<h2>Model information</h2><div id="info" class="box">Open a GLB to inspect it.</div></aside>
<main id="drop"><div id="viewer"></div></main><footer id="status">Choose a GLB or open the last model exported by JX Anatomy.</footer></div>
<script src="../host/browser/jx-glb-store.js"></script>
<script type="module">
import {JXGLBViewer} from '../host/browser/jx-glb-viewer.js';
const $=id=>document.getElementById(id),viewer=new JXGLBViewer($('viewer'));
function status(s){$('status').textContent=s}
function showInfo(d,meta={}){$('info').innerHTML='<span class="good">'+(meta.name||d.name||'GLB')+'</span><br>'+d.meshes+' meshes · '+d.vertices.toLocaleString()+' vertices · '+d.triangles.toLocaleString()+' triangles<br>'+d.materials+' materials · '+d.textures+' textures · '+d.animations.length+' animations'+(meta.size?'<br>'+Math.round(meta.size/1024).toLocaleString()+' KiB':'');const sel=$('animation');sel.innerHTML='<option value="">No animation</option>';d.animations.forEach(a=>{const o=document.createElement('option');o.value=a.index;o.textContent=a.name+' · '+a.duration.toFixed(2)+' s';sel.appendChild(o)})}
async function loadBlob(blob,name){try{status('Loading '+name+'…');const d=await viewer.loadBlob(blob,name);showInfo(d,{name,size:blob.size});status('Loaded '+name+'. Drag to orbit, wheel to zoom.')}catch(e){status('Could not load GLB: '+(e&&e.message||e));$('info').innerHTML='<span class="warn">Invalid or unsupported GLB.</span>'}}
$('file').onchange=e=>{const f=e.target.files&&e.target.files[0];if(f)loadBlob(f,f.name)};
$('openLast').onclick=async()=>{try{const rec=await JXGLBStore.load('last');if(!rec){status('No JX-exported GLB is stored yet. Build one in Anatomy Designer first.');return}await loadBlob(rec.blob,(rec.meta&&rec.meta.name)||'jx-anatomy-model.glb')}catch(e){status('Could not open stored GLB: '+(e&&e.message||e))}};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>b.dataset.view==='frame'?viewer.frame():viewer.view(b.dataset.view));
$('grid').onchange=e=>viewer.setGrid(e.target.checked);$('axes').onchange=e=>viewer.setAxes(e.target.checked);$('wire').onchange=e=>viewer.setWireframe(e.target.checked);$('play').onclick=()=>{const v=$('animation').value;if(v!=='')viewer.playAnimation(Number(v))};$('stop').onclick=()=>viewer.stopAnimation();
const drop=$('drop');['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.style.outline='2px solid #5ba8f5'}));['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.style.outline=''}));drop.addEventListener('drop',e=>{const f=[...(e.dataTransfer&&e.dataTransfer.files||[])].find(f=>/\.glb$/i.test(f.name));if(f)loadBlob(f,f.name)});
if(new URLSearchParams(location.search).get('source')==='last')$('openLast').click();
</script></body></html>
