<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JX Arm Muscle + Skin Demo</title><style>
html,body{height:100%;margin:0;background:#10151c;color:#e8edf5;font:14px system-ui}*{box-sizing:border-box}#app{height:100%;display:grid;grid-template-columns:280px minmax(420px,1fr) 310px;grid-template-rows:48px 1fr 32px}header{grid-column:1/4;display:flex;align-items:center;gap:10px;padding:0 14px;background:#181e27;border-bottom:1px solid #2d3745}header b{font-size:16px}.pill{padding:5px 8px;border:1px solid #3a4657;border-radius:8px;background:#202834}aside{padding:12px;background:#161b23;overflow:auto}.left{border-right:1px solid #2d3745}.right{border-left:1px solid #2d3745}main{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;background:#0b1016;overflow:auto}canvas{display:block;width:min(920px,100%);height:auto;touch-action:none;cursor:crosshair;border:1px solid #2d3745;background:#d8d2c5}footer{grid-column:1/4;padding:6px 12px;background:#181e27;border-top:1px solid #2d3745;color:#9ba9ba;font-size:12px}h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#91a3b8;margin:14px 0 8px}.action,select,input[type=number]{width:100%;padding:8px;margin:3px 0;border:1px solid #364255;border-radius:6px;background:#202833;color:#eef3fb}.action{cursor:pointer}.row{display:grid;grid-template-columns:1fr 88px;gap:8px;align-items:center;margin:8px 0}.box{padding:9px;border:1px solid #334154;border-radius:7px;background:#111820}.hint{font-size:12px;line-height:1.45;color:#99a8ba}.check{display:flex;gap:8px;align-items:center;margin:8px 0}.good{color:#8bd698}@media(max-width:900px){#app{grid-template-columns:1fr;grid-template-rows:auto auto auto auto auto}header,footer{grid-column:1}.left,.right{border:0}}
</style></head><body><div id="app"><header><b>JX Designer · Arm Surface</b><span class="pill">Bones</span><span class="pill">Muscle</span><span class="pill">Skin</span><span class="pill">IK</span></header><aside class="left"><h2>Layers</h2><label class="check"><input id="showSkin" type="checkbox" checked> Skin</label><label class="check"><input id="showMuscle" type="checkbox" checked> Muscle</label><label class="check"><input id="showBones" type="checkbox" checked> Bones</label><h2>Skin</h2><select id="skin"><option value="human">Human</option><option value="dark">Dark</option><option value="pale">Pale</option><option value="fur">Fur</option><option value="scales">Scales</option><option value="hide">Hide</option></select><div class="row"><label>Muscle tone</label><input id="tone" type="number" min="0" max="1" step=".05" value=".55"></div><div class="row"><label>Pumpedness</label><input id="pump" type="number" min="0" max="2" step=".05" value=".55"></div><div class="row"><label>Mass</label><input id="mass" type="number" min=".3" max="2.5" step=".05" value="1"></div><div class="row"><label>Soft tissue</label><input id="fat" type="number" min="0" max="1.5" step=".05" value=".18"></div><button class="action" id="reset">Reset Arm</button></aside><main><canvas id="canvas" width="920" height="650"></canvas></main><aside class="right"><h2>Semantic anatomy</h2><div class="box"><b>Arm</b><br><span class="good">shoulder → elbow → wrist</span><br><span class="good">upper-arm → forearm</span><p class="hint">Drag the gold wrist. The elbow solves automatically and the muscle + skin regenerate around the new pose.</p></div><h2>IK</h2><div class="row"><label>Elbow bend</label><input id="pole" type="number" min="-1" max="1" step=".05" value=".55"></div><button class="action" id="home">Return to fitted pose</button><h2>Export preview</h2><div id="json" class="box hint" style="white-space:pre-wrap;max-height:260px;overflow:auto"></div></aside><footer id="status">Drag the wrist to pose the Arm.</footer></div><script>
(function(){'use strict';const c=document.getElementById('canvas'),x=c.getContext('2d'),$=id=>document.getElementById(id);let drag=false,home=null;const skins={human:{base:'#c58f70',muscle:'#a95f55',hi:'#e5b18d'},dark:{base:'#6d4335',muscle:'#7d3f3c',hi:'#9f6752'},pale:{base:'#e2baa2',muscle:'#b66d65',hi:'#f2d0ba'},fur:{base:'#8a6a4d',muscle:'#795046',hi:'#b39572'},scales:{base:'#66785b',muscle:'#7b514a',hi:'#98aa78'},hide:{base:'#9a7658',muscle:'#82504a',hi:'#bea07f'}};let j=[];function n(id,f){const v=Number($(id).value);return Number.isFinite(v)?v:f}function reset(){j=[{id:'shoulder',x:250,y:230},{id:'elbow',x:445,y:320},{id:'wrist',x:690,y:390}];home={x:690,y:390};draw()}function ref(){x.fillStyle='#d8d2c5';x.fillRect(0,0,c.width,c.height);x.fillStyle='#bbb5a9';x.beginPath();x.ellipse(170,210,94,126,-.1,0,Math.PI*2);x.fill();x.strokeStyle='#9d968a';x.lineCap='round';x.lineWidth=94;x.beginPath();x.moveTo(245,230);x.lineTo(440,315);x.stroke();x.lineWidth=74;x.beginPath();x.moveTo(440,315);x.lineTo(685,380);x.stroke();x.fillStyle='#9d968a';x.beginPath();x.ellipse(712,389,52,34,.2,0,Math.PI*2);x.fill()}function segment(a,b,kind){const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy),ang=Math.atan2(dy,dx),tone=n('tone',.55),pump=n('pump',.55),mass=n('mass',1),fat=n('fat',.18),s=skins[$('skin').value]||skins.human;let base=kind==='upper'?36:30,mid=kind==='upper'?1.42:1.25,end=kind==='upper'?.78:.56,start=kind==='upper'?.86:1.05;const samples=24,left=[],right=[];for(let i=0;i<=samples;i++){const t=i/samples,u=t<=.5?start+(mid-start)*t*2:mid+(end-mid)*(t-.5)*2,rad=base*u*(1+tone*.22+pump*.34)*mass+base*fat*.35,cx=a.x+dx*t,cy=a.y+dy*t,nx=-Math.sin(ang),ny=Math.cos(ang);left.push([cx+nx*rad,cy+ny*rad]);right.push([cx-nx*rad,cy-ny*rad])}function path(){x.beginPath();x.moveTo(...left[0]);for(const p of left.slice(1))x.lineTo(...p);for(const p of right.reverse())x.lineTo(...p);x.closePath()}if($('showMuscle').checked){path();x.fillStyle=s.muscle;x.globalAlpha=.68;x.fill();x.globalAlpha=1;const cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;x.save();x.translate(cx,cy);x.rotate(ang);x.fillStyle=s.hi;x.globalAlpha=.28;x.beginPath();x.ellipse(0,kind==='upper'?-9:7,L*(kind==='upper'?.30:.27),base*(kind==='upper'?.75:.60)*(1+pump*.3),0,0,Math.PI*2);x.fill();x.restore();x.globalAlpha=1}if($('showSkin').checked){path();x.fillStyle=s.base;x.globalAlpha=.70;x.fill();x.globalAlpha=1;x.strokeStyle=s.hi;x.lineWidth=1.5;x.stroke();if($('skin').value==='scales'){x.save();path();x.clip();x.strokeStyle=s.hi;x.globalAlpha=.25;for(let yy=Math.min(a.y,b.y)-60;yy<Math.max(a.y,b.y)+60;yy+=10)for(let xx=Math.min(a.x,b.x)-60;xx<Math.max(a.x,b.x)+60;xx+=10){x.beginPath();x.arc(xx,yy,5,0,Math.PI);x.stroke()}x.restore()}if($('skin').value==='fur'){x.save();path();x.clip();x.strokeStyle=s.hi;x.globalAlpha=.22;for(let yy=Math.min(a.y,b.y)-60;yy<Math.max(a.y,b.y)+60;yy+=8)for(let xx=Math.min(a.x,b.x)-60;xx<Math.max(a.x,b.x)+60;xx+=10){x.beginPath();x.moveTo(xx,yy);x.lineTo(xx+3,yy-5);x.stroke()}x.restore()}}}function drawBones(){if(!$('showBones').checked)return;x.strokeStyle='#2e84c6';x.lineWidth=4;x.beginPath();x.moveTo(j[0].x,j[0].y);x.lineTo(j[1].x,j[1].y);x.lineTo(j[2].x,j[2].y);x.stroke();j.forEach((p,i)=>{x.beginPath();x.arc(p.x,p.y,i===2?9:7,0,Math.PI*2);x.fillStyle=i===2?'#e9b64f':'#62a9e8';x.fill();x.strokeStyle='#14202b';x.lineWidth=2;x.stroke()})}function draw(){ref();segment(j[0],j[1],'upper');segment(j[1],j[2],'fore');drawBones();$('json').textContent=JSON.stringify({bodyPart:{id:'demo-arm',type:'arm',ports:['shoulder','elbow','wrist'],segments:['upper-arm','forearm'],surface:{skin:$('skin').value,muscleTone:n('tone',.55),pumpedness:n('pump',.55),mass:n('mass',1),fatCover:n('fat',.18)},ik:true}},null,2)}function solve(t){const S=j[0],E=j[1],W=j[2],L1=Math.hypot(E.x-S.x,E.y-S.y),L2=Math.hypot(W.x-E.x,W.y-E.y),dx=t.x-S.x,dy=t.y-S.y,d0=Math.max(.001,Math.hypot(dx,dy)),d=Math.min(L1+L2-.001,Math.max(Math.abs(L1-L2)+.001,d0)),ux=dx/d0,uy=dy/d0,a=(L1*L1-L2*L2+d*d)/(2*d),h=Math.sqrt(Math.max(0,L1*L1-a*a)),px=S.x+ux*a,py=S.y+uy*a,sg=n('pole',.55)>=0?1:-1,nx=-uy*sg,ny=ux*sg;E.x=px+nx*h;E.y=py+ny*h;W.x=S.x+ux*d;W.y=S.y+uy*d;draw()}function pt(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}c.addEventListener('pointerdown',e=>{const p=pt(e),w=j[2];if(Math.hypot(p.x-w.x,p.y-w.y)<34){drag=true;c.setPointerCapture(e.pointerId)}});c.addEventListener('pointermove',e=>{if(drag)solve(pt(e))});c.addEventListener('pointerup',e=>{drag=false;try{c.releasePointerCapture(e.pointerId)}catch(_){}});['showSkin','showMuscle','showBones','skin','tone','pump','mass','fat','pole'].forEach(id=>$(id).addEventListener('input',draw));$('reset').addEventListener('click',reset);$('home').addEventListener('click',()=>home&&solve(home));reset()})();
</script></body></html>
